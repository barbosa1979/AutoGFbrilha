<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>As Minhas Consultas</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 20px;
            background-color: #004aad;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logout {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 0;
            width: 140px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .container {
            background-color: #fff;
            margin-top: 40px;
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #004aad;
            color: white;
        }

        .btn-cancelar {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        #msg {
            margin-top: 10px;
            font-weight: bold;
            color: #ff4d4d;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>As Minhas Consultas</h1>
        <button id="btnLogout" class="logout">Logout</button>
    </div>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Hora</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaConsultas"></tbody>
        </table>

        <p id="msg"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const client = supabase.createClient(
            "https://kciuazncizxggwcausbs.supabase.co",
            "sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt"
        );

        const tabela = document.getElementById("tabelaConsultas");
        const msg = document.getElementById("msg");

        document.getElementById("btnLogout").onclick = async () => {
            await client.auth.signOut();
            window.location.href = "index.html";
        };

        async function carregarConsultas() {
            const { data: userData } = await client.auth.getUser();
            if (!userData || !userData.user) {
                window.location.href = "index.html";
                return;
            }

            const userId = userData.user.id;

            // JOIN entre agendamentos e horarios
            const { data, error } = await client
                .from("agendamentos")
                .select(`
                    id,
                    estado,
                    confirmado,
                    horarios (
                        dia,
                        hora
                    )
                `)
                .eq("utilizador_id", userId);

            if (error) {
                msg.textContent = "Erro ao carregar consultas: " + error.message;
                return;
            }

            tabela.innerHTML = "";

            data.forEach(a => {
                tabela.innerHTML += `
                    <tr>
                        <td>${a.horarios.dia}</td>
                        <td>${a.horarios.hora}</td>
                        <td>${a.estado}</td>
                        <td>
                            <button class="btn-cancelar" onclick="cancelar(${a.id})">
                                Cancelar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        carregarConsultas();

        async function cancelar(id) {
            const { error } = await client
                .from("agendamentos")
                .delete()
                .eq("id", id);

            if (error) {
                msg.textContent = "Erro ao cancelar: " + error.message;
                return;
            }

            msg.style.color = "#00a82d";
            msg.textContent = "Agendamento cancelado!";
            carregarConsultas();
        }
    </script>
</body>
</html>
