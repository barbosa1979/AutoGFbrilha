<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente - AutoGF Brilha</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            width: 100%;
            padding: 20px;
            background-color: #004aad;
            color: white;
            text-align: center;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        /* CONTAINER */
        .container {
            background-color: #fff;
            margin-top: 40px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        .container h2 {
            color: #004aad;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            background-color: #004aad;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #003a8c;
        }

        #msg {
            font-size: 0.9rem;
            color: #555;
            margin-top: 10px;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                width: 90%;
                padding: 25px;
                margin-top: 20px;
                box-shadow: none;
                border-radius: 0;
            }

            button {
                font-size: 1rem;
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>AutoGF Brilha</h1>
    </div>

    <div class="container">
        <h2>Login Cliente</h2>

        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button id="btnLogin">LOGIN</button>
        <button onclick="window.location.href='criarconta.html'">CRIAR CONTA</button>

        <p id="msg"></p>
    </div>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const btnLogin = document.getElementById('btnLogin');

        btnLogin.addEventListener('click', async () => {
            msg.textContent = "A autenticar...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                msg.textContent = "Preencha todos os campos.";
                return;
            }

            const { data, error } = await client.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                msg.textContent = "Erro: " + error.message;
                return;
            }

            const user = data.user;

            // Verificação do tipo de utilizador
            const { data: userData, error: tipoError } = await client
                .from('utilizadores')
                .select('tipo')
                .eq('email', email)
                .single();

            if (tipoError || !userData) {
                msg.textContent = "Erro ao verificar tipo de utilizador.";
                await client.auth.signOut();
                return;
            }

            if (userData.tipo !== 'cliente') {
                msg.textContent = "Acesso negado — esta conta não é de cliente.";
                await client.auth.signOut();
                return;
            }

            msg.textContent = "Login bem-sucedido! A redirecionar...";
            setTimeout(() => window.location.href = 'home.html', 800);
        });
    </script>
</body>
</html>
