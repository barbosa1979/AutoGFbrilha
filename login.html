<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoGF Brilha</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="container">
        <h1>Auto<span>GF</span> Brilha</h1>
        <h2>Serviço de Limpeza Auto</h2>

        <input type="email" id="email" placeholder="email">
        <input type="password" id="password" placeholder="Password">

        <button id="btnLogin">LOGIN</button>
        <button onclick="window.location.href='criarconta.html'">CRIAR CONTA</button>

        <p id="msg" style="margin-top:20px; font-size:14px; color:#666;"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const btnLogin = document.getElementById('btnLogin');

        async function verificarSessao() {
            const { data } = await supabase.auth.getUser();

            if (data && data.user) {
                msg.textContent = 'Já está autenticado, a redirecionar...';

                if (data.user.email === 'admin@admin.com') {
                    setTimeout(() => window.location.href = 'admin.html', 800);
                } else {
                    setTimeout(() => window.location.href = 'home.html', 800);
                }
            }
        }

        verificarSessao();

        btnLogin.addEventListener('click', async () => {
            msg.textContent = 'A autenticar...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                msg.textContent = 'Preencha todos os campos.';
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                msg.textContent = 'Erro: ' + error.message;
                return;
            }

            msg.textContent = 'Login efetuado com sucesso!';

            if (data.user.email === 'admin@admin.com') {
                setTimeout(() => window.location.href = 'admin.html', 800);
            } else {
                setTimeout(() => window.location.href = 'home.html', 800);
            }
        });
    </script>
</body>
</html>
