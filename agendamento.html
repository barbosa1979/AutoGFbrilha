<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Lavagem</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 20px;
            background-color: #004aad;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .logout {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 0;
            width: 140px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .logout:hover {
            background-color: #d93636;
        }

        .container {
            background-color: #fff;
            margin-top: 60px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .container h2 {
            color: #004aad;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        select {
            width: 100%;
            padding: 12px 0;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            background-color: #004aad;
            color: #fff;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #003a8c;
        }

        #msg {
            color: #ff4d4d;
            font-weight: 500;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .logout {
                width: 140px;
                padding: 12px 0;
                font-size: 1rem;
            }

            .container {
                width: 95%;
                padding: 25px;
                margin-top: 20px;
                box-shadow: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Agendar Lavagem</h1>
        <button id="btnLogout" class="logout">Logout</button>
    </div>

    <div class="container">
        <h2>Escolher Horário</h2>

        <select id="dia"></select>
        <select id="hora"></select>

        <button id="btnConfirmar">Confirmar Agendamento</button>

        <p id="msg"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const diaSelect = document.getElementById('dia');
        const horaSelect = document.getElementById('hora');

        document.getElementById('btnLogout').onclick = async () => {
            await client.auth.signOut();
            window.location.href = 'index.html';
        };

        async function verificarSessao() {
            const { data, error } = await client.auth.getUser();
            if (error || !data || !data.user) {
                window.location.href = 'index.html';
                return;
            }
        }

        verificarSessao();

        async function carregarHorarios() {
            const { data, error } = await client
                .from('horarios')
                .select('*')
                .eq('ocupado', false)
                .order('dia', { ascending: true })
                .order('hora', { ascending: true });

            if (error) {
                msg.textContent = "Erro ao carregar horários: " + error.message;
                console.error(error);
                return;
            }

            const diasUnicos = [...new Set(data.map(h => h.dia))];
            diaSelect.innerHTML = diasUnicos.map(d => `<option value="${d}">${d}</option>`).join('');

            atualizarHoras(diasUnicos[0], data);
            diaSelect.onchange = () => atualizarHoras(diaSelect.value, data);
        }

        function atualizarHoras(diaSelecionado, horarios) {
            const horas = horarios.filter(h => h.dia === diaSelecionado).map(h => h.hora);
            horaSelect.innerHTML = horas.map(h => `<option value="${h}">${h}</option>`).join('');
        }

        carregarHorarios();

        document.getElementById('btnConfirmar').onclick = async () => {
            const dia = diaSelect.value;
            const hora = horaSelect.value;

            if (!dia || !hora) {
                msg.textContent = "Selecione o dia e a hora.";
                return;
            }

            const { data: userData } = await client.auth.getUser();
            const email = userData?.user?.email;

            if (!email) {
                msg.textContent = "Sessão expirada. Faça login novamente.";
                return;
            }

            // Buscar o ID do horário selecionado
            const { data: horarioData, error: horarioError } = await client
                .from('horarios')
                .select('id')
                .eq('dia', dia)
                .eq('hora', hora)
                .single();

            if (horarioError || !horarioData) {
                msg.textContent = "Erro ao localizar horário.";
                console.error(horarioError);
                return;
            }

            const horario_id = horarioData.id;

            // Inserir agendamento com horario_id
            const { error } = await client
                .from('agendamentos')
                .insert([{ horario_id, confirmado: false, estado: 'pendente', marca: '', modelo: '', tipo_lavagem: '', utilizador_id: userData.user.id }]);

            if (error) {
                msg.textContent = "Erro ao agendar: " + error.message;
                console.error(error);
                return;
            }

            // Atualizar horário para ocupado
            await client
                .from('horarios')
                .update({ ocupado: true })
                .eq('id', horario_id);

            msg.style.color = "#00a82d";
            msg.textContent = "Agendamento confirmado com sucesso!";
        };
    </script>
</body>
</html>
