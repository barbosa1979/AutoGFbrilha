<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta Admin - AutoGF Brilha</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/criarcontaadmin.css">
</head>

<body>
    <div class="container">
        <h1>Auto<span style="color:red;">GF</span> Brilha</h1>
        <h2>Criar Conta Administrativa</h2>

        <input type="email" id="email" placeholder="email">
        <input type="password" id="password" placeholder="Password">
        <input type="text" id="nome" placeholder="Nome completo">
        <input type="text" id="telemovel" placeholder="Telemóvel">

        <button id="btnCriarConta">CRIAR CONTA</button>
        <button id="btnVoltar">VOLTAR AO LOGIN</button>

        <p id="msg" style="margin-top:20px; font-size:14px; color:#666;"></p>
    </div>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const btnCriarConta = document.getElementById('btnCriarConta');
        const btnVoltar = document.getElementById('btnVoltar');

        btnVoltar.addEventListener('click', () => {
            window.location.href = 'indexadmin.html';
        });

        btnCriarConta.addEventListener('click', async () => {
            msg.textContent = 'A criar conta...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const nome = document.getElementById('nome').value.trim();
            const telemovel = document.getElementById('telemovel').value.trim();

            if (!email || !password || !nome || !telemovel) {
                msg.textContent = 'Preencha todos os campos.';
                return;
            }

            // Verificar email duplicado
            const { data: existente } = await client
                .from('utilizadores')
                .select('email')
                .eq('email', email)
                .single();

            if (existente) {
                msg.textContent = 'Este email já está registado.';
                return;
            }

            // Criar utilizador no Auth
            const { data, error } = await client.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                msg.textContent = 'Erro: ' + error.message;
                return;
            }

            const user = data.user;

            // Inserir dados na tabela utilizadores
            const { error: erroInsert } = await client
                .from('utilizadores')
                .insert({
                    id: user.id,
                    email: email,
                    nome: nome,
                    telemovel: telemovel,
                    tipo: 'admin'
                });

            if (erroInsert) {
                msg.textContent = 'Erro ao guardar dados: ' + erroInsert.message;
                return;
            }

            msg.textContent = 'Conta admin criada com sucesso! A redirecionar...';

            setTimeout(() => window.location.href = 'homeadmin.html', 800);
        });
    </script>
</body>
</html>
