<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Horários - Admin</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            width: 100%;
            padding: 20px;
            background-color: #004aad;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        /* BOTÃO LOGOUT PEQUENO */
        .logout {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 0;
            width: 140px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .logout:hover {
            background-color: #d93636;
        }

        /* CONTAINER */
        .container {
            background-color: #fff;
            margin-top: 40px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .container h2 {
            color: #004aad;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            background-color: #004aad;
            color: #fff;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #003a8c;
        }

        /* TABELA */
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
            text-align: center;
        }

        th {
            background-color: #004aad;
            color: white;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            margin: 2px;
        }

        .ocupado {
            background-color: #ff4d4d;
            color: white;
        }

        .livre {
            background-color: #00a82d;
            color: white;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {

            .header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .logout {
                width: 140px;
                padding: 12px 0;
                font-size: 1rem;
            }

            .container {
                width: 95%;
                padding: 25px;
                margin-top: 20px;
                box-shadow: none;
                border-radius: 0;
            }

            table {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Gestão de Horários</h1>
        <button id="btnLogout" class="logout">Logout</button>
    </div>

    <div class="container">
        <h2>Adicionar Horário</h2>

        <input type="date" id="dia">
        <input type="time" id="hora">

        <button id="btnAdd">Adicionar Horário</button>

        <p id="msg"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dia</th>
                    <th>Hora</th>
                    <th>Ocupado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaHorarios"></tbody>
        </table>
    </div>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const tabela = document.getElementById('tabelaHorarios');

        document.getElementById('btnLogout').onclick = async () => {
            await client.auth.signOut();
            window.location.href = 'indexadmin.html';
        };

        async function verificarSessao() {
            const { data, error } = await client.auth.getUser();
            if (error || !data || !data.user) {
                window.location.href = 'indexadmin.html';
                return;
            }

            const email = data.user.email;

            const { data: userData } = await client
                .from('utilizadores')
                .select('tipo')
                .eq('email', email)
                .single();

            if (!userData || userData.tipo !== 'admin') {
                await client.auth.signOut();
                window.location.href = 'indexadmin.html';
            }
        }

        verificarSessao();

        async function carregarHorarios() {
            const { data, error } = await client
                .from('horarios')
                .select('*')
                .order('dia', { ascending: true })
                .order('hora', { ascending: true });

            tabela.innerHTML = "";

            data.forEach(h => {
                tabela.innerHTML += `
                    <tr>
                        <td>${h.id}</td>
                        <td>${h.dia}</td>
                        <td>${h.hora}</td>
                        <td>${h.ocupado ? "Sim" : "Não"}</td>
                        <td>
                            <button class="btn-small ${h.ocupado ? "livre" : "ocupado"}"
                                onclick="toggleOcupado(${h.id}, ${h.ocupado})">
                                ${h.ocupado ? "Marcar Livre" : "Marcar Ocupado"}
                            </button>
                            <button class="btn-small ocupado" onclick="eliminar(${h.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        carregarHorarios();

        document.getElementById('btnAdd').onclick = async () => {
            const dia = document.getElementById('dia').value;
            const hora = document.getElementById('hora').value;

            if (!dia || !hora) {
                msg.textContent = "Preencha todos os campos.";
                return;
            }

            const { error } = await client
                .from('horarios')
                .insert([{ dia, hora, ocupado: false }]);

            if (error) {
                msg.textContent = "Erro ao adicionar.";
                return;
            }

            msg.textContent = "Horário adicionado!";
            carregarHorarios();
        };

        async function toggleOcupado(id, estadoAtual) {
            await client
                .from('horarios')
                .update({ ocupado: !estadoAtual })
                .eq('id', id);

            carregarHorarios();
        }

        async function eliminar(id) {
            await client
                .from('horarios')
                .delete()
                .eq('id', id);

            carregarHorarios();
        }
    </script>
</body>
</html>
