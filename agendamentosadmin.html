<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Agendamentos - Admin</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            width: 100%;
            padding: 20px;
            background-color: #004aad;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .logout {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .logout:hover {
            background-color: #d93636;
        }

        /* CONTAINER */
        .container {
            background-color: #fff;
            margin-top: 40px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 95%;
            max-width: 900px;
        }

        .container h2 {
            color: #004aad;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        /* TABELA */
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 0.9rem;
            text-align: center;
        }

        th {
            background-color: #004aad;
            color: white;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            margin: 2px;
        }

        .confirmar {
            background-color: #00a82d;
            color: white;
        }

        .cancelar {
            background-color: #ff9800;
            color: white;
        }

        .eliminar {
            background-color: #ff4d4d;
            color: white;
        }

        /* RESPONSIVIDADE */
        @media (max-width: 600px) {
            .container {
                width: 100%;
                padding: 20px;
                margin-top: 10px;
                box-shadow: none;
                border-radius: 0;
            }

            table {
                font-size: 0.75rem;
            }

            th, td {
                padding: 6px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Gestão de Agendamentos</h1>
        <button id="btnLogout" class="logout">Logout</button>
    </div>

    <div class="container">
        <h2>Lista de Agendamentos</h2>

        <p id="msg"></p>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Email</th>
                    <th>Telemóvel</th>
                    <th>Dia</th>
                    <th>Hora</th>
                    <th>Confirmado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAgendamentos"></tbody>
        </table>
    </div>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const tabela = document.getElementById('tabelaAgendamentos');

        document.getElementById('btnLogout').onclick = async () => {
            await client.auth.signOut();
            window.location.href = 'indexadmin.html';
        };

        async function verificarSessao() {
            const { data, error } = await client.auth.getUser();
            if (error || !data || !data.user) {
                window.location.href = 'indexadmin.html';
                return;
            }

            const email = data.user.email;

            const { data: userData } = await client
                .from('utilizadores')
                .select('tipo')
                .eq('email', email)
                .single();

            if (!userData || userData.tipo !== 'admin') {
                await client.auth.signOut();
                window.location.href = 'indexadmin.html';
            }
        }

        verificarSessao();

        async function carregarAgendamentos() {
            const { data, error } = await client
                .from('agendamentos')
                .select('*')
                .order('dia', { ascending: true })
                .order('hora', { ascending: true });

            tabela.innerHTML = "";

            data.forEach(a => {
                tabela.innerHTML += `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.nome}</td>
                        <td>${a.email}</td>
                        <td>${a.telemovel}</td>
                        <td>${a.dia}</td>
                        <td>${a.hora}</td>
                        <td>${a.confirmado ? "Sim" : "Não"}</td>
                        <td>
                            <button class="btn-small confirmar" onclick="confirmar(${a.id})">Confirmar</button>
                            <button class="btn-small cancelar" onclick="cancelar(${a.id})">Cancelar</button>
                            <button class="btn-small eliminar" onclick="eliminar(${a.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        carregarAgendamentos();

        async function confirmar(id) {
            await client
                .from('agendamentos')
                .update({ confirmado: true })
                .eq('id', id);

            carregarAgendamentos();
        }

        async function cancelar(id) {
            await client
                .from('agendamentos')
                .update({ confirmado: false })
                .eq('id', id);

            carregarAgendamentos();
        }

        async function eliminar(id) {
            await client
                .from('agendamentos')
                .delete()
                .eq('id', id);

            carregarAgendamentos();
        }
    </script>
</body>
</html>
