<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Admin</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            background-color: #004aad;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .logout {
            background-color: #ff4d4d;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .logout:hover {
            background-color: #d93636;
        }

        .container {
            background-color: #fff;
            margin-top: 40px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        .container h2 {
            color: #004aad;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        .menu button {
            background-color: #004aad;
            color: #fff;
            border: none;
            padding: 12px 0;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        .menu button:hover {
            background-color: #003a8c;
        }

        #msg {
            font-size: 0.9rem;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Painel de Gestão</h1>
        <button id="btnLogout" class="logout">Logout</button>
    </div>

    <div class="container">
        <h2>Bem-vindo, Administrador</h2>

        <div class="menu">
            <button onclick="window.location.href='horariosadmin.html'">Gerir Horários</button>
            <button onclick="window.location.href='agendamentosadmin.html'">Gerir Agendamentos</button>
        </div>

        <p id="msg"></p>
    </div>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msg = document.getElementById('msg');
        const btnLogout = document.getElementById('btnLogout');

        btnLogout.addEventListener('click', async () => {
            await client.auth.signOut();
            window.location.href = 'indexadmin.html';
        });

        async function verificarSessao() {
            const { data, error } = await client.auth.getUser();

            if (error || !data || !data.user) {
                window.location.href = 'indexadmin.html';
                return;
            }

            const email = data.user.email;

            const { data: userData, error: tipoError } = await client
                .from('utilizadores')
                .select('tipo')
                .eq('email', email)
                .single();

            if (tipoError || !userData || userData.tipo !== 'admin') {
                await client.auth.signOut();
                window.location.href = 'indexadmin.html';
                return;
            }

            msg.textContent = "Sessão verificada — acesso autorizado.";
        }

        verificarSessao();
    </script>
</body>
</html>
