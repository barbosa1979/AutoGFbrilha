<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - AutoGF Brilha</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>
    <div class="container">
        <h1>Painel de Gestão</h1>

        <div id="listaAgendamentos" style="margin-top:20px;"></div>

        <button onclick="window.location.href='home.html'">Voltar</button>
        <button id="btnLogout" style="background-color:#c62828;">Logout</button>

        <p id="msg" style="margin-top:20px; font-size:14px; color:#666;"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://kciuazncizxggwcausbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Hj1NyO3IbGrxF7TU9-eUFg_keNV4pFt';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const lista = document.getElementById('listaAgendamentos');
        const msg = document.getElementById('msg');
        const btnLogout = document.getElementById('btnLogout');

        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        async function verificarAdmin() {
            msg.textContent = 'A verificar sessão...';

            const { data, error } = await supabase.auth.getUser();

            if (error || !data || !data.user) {
                msg.textContent = 'Não autenticado — a redirecionar...';
                setTimeout(() => window.location.href = 'index.html', 800);
                return;
            }

            const user = data.user;

            if (user.email !== 'admin@admin.com') {
                msg.textContent = 'Acesso negado — não é admin.';
                setTimeout(() => window.location.href = 'home.html', 800);
                return;
            }

            msg.textContent = 'Bem-vindo, administrador.';
            carregarAgendamentos();
        }

        verificarAdmin();

        async function carregarAgendamentos() {
            msg.textContent = 'A carregar agendamentos...';

            const { data: agendamentos, error } = await supabase
                .from('agendamentos')
                .select('*')
                .order('dia', { ascending: true })
                .order('hora', { ascending: true });

            if (error) {
                msg.textContent = 'Erro ao carregar agendamentos.';
                return;
            }

            msg.textContent = '';

            if (agendamentos.length === 0) {
                lista.innerHTML = '<p>Sem agendamentos.</p>';
                return;
            }

            lista.innerHTML = '';

            agendamentos.forEach(a => {
                const div = document.createElement('div');
                div.style.border = '1px solid #ccc';
                div.style.padding = '10px';
                div.style.marginBottom = '10px';
                div.style.borderRadius = '8px';
                div.style.textAlign = 'left';

                div.innerHTML = `
                    <strong>ID:</strong> ${a.id}<br>
                    <strong>Dia:</strong> ${a.dia}<br>
                    <strong>Hora:</strong> ${a.hora}<br>
                    <strong>Ocupado:</strong> ${a.ocupado ? 'Sim' : 'Não'}<br>
                    <strong>Confirmado:</strong> ${a.confirmado ? 'Sim' : 'Não'}<br><br>

                    <button style="background-color:#2e7d32; color:white; margin-right:10px;"
                        onclick="confirmar(${a.id})">Confirmar</button>

                    <button style="background-color:#c62828; color:white;"
                        onclick="apagar(${a.id}, '${a.dia}', '${a.hora}')">Apagar</button>
                `;

                lista.appendChild(div);
            });
        }

        async function confirmar(id) {
            msg.textContent = 'A confirmar agendamento...';

            const { error } = await supabase
                .from('agendamentos')
                .update({ confirmado: true })
                .eq('id', id);

            if (error) {
                msg.textContent = 'Erro ao confirmar.';
                return;
            }

            msg.textContent = 'Agendamento confirmado!';
            carregarAgendamentos();
        }

        async function apagar(id, dia, hora) {
            msg.textContent = 'A apagar agendamento...';

            const { error: erroHorario } = await supabase
                .from('horarios')
                .update({ ocupado: false })
                .eq('dia', dia)
                .eq('hora', hora);

            if (erroHorario) {
                msg.textContent = 'Erro ao libertar horário.';
                return;
            }

            const { error: erroAgendamento } = await supabase
                .from('agendamentos')
                .delete()
                .eq('id', id);

            if (erroAgendamento) {
                msg.textContent = 'Erro ao apagar agendamento.';
                return;
            }

            msg.textContent = 'Agendamento apagado!';
            carregarAgendamentos();
        }
    </script>
</body>
</html>
